name: Bygg Android-app
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Bygg test-APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: EfterMotet-Android-test
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  publish-test-release:
    if: github.event_name == 'workflow_dispatch'
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: EfterMotet-Android-test
      - name: Publicera APK för OCR-test 1.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv app-debug.apk EfterMotet-Android-OCR-v1.1.apk
          gh release create v1.1-ocr-test EfterMotet-Android-OCR-v1.1.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'EfterMötet – OCR-test 1.1' --notes 'OCR-text som kan urskiljas läggs nu till för kontroll och rättning. Testversion för Android; kontrollera texten mot dokumentet innan du sparar.' --prerelease
