name: Kontrollera EfterMötet
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Bygg båda Androidvarianterna och granska
        run: gradle --no-daemon assembleDemoDebug assemblePlayDebug lintDemoDebug lintPlayDebug testPlayDebugUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: EfterMotet-test-1.4
          path: app/build/outputs/apk/demo/debug/app-demo-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: EfterMotet-Play-kandidat-1.4
          path: app/build/outputs/apk/play/debug/app-play-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: lint-resultat
          path: app/build/reports/lint-results-*.html
  interface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: node tests/local-checks.cjs
      - run: node tests/smoke.cjs
